:root { --void: #070716; --stone: #15132a; --line: #3a3560; --bone: #f1e9d8; --ash: #b4adc4; --ember: #ffa13d; --arc: #5cf2ff; --wound: #ff4a78; --life: #7dffb0;
  --display: 'Grenze Gotisch', 'Times New Roman', serif; --ui: 'Chakra Petch', 'Segoe UI', Arial, sans-serif; }
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 100%; height: 100%; background: var(--void); color: var(--bone); overflow: hidden; font-family: var(--ui); }
#wrap { position: absolute; left: 0; top: 0; width: 100%; height: 100%; overflow: hidden; background: var(--void); }
#stage { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; overflow: hidden; transform-origin: 0 0; background: var(--void); }
#view { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; image-rendering: pixelated; }
.screen { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; display: none; }
.screen.on { display: block; }

/* home */
#home::before { content: ''; position: absolute; left: 0; right: 0; bottom: 0; height: 430px; background: linear-gradient(to bottom, rgba(7,7,22,0), rgba(7,7,22,.8) 34%, rgba(7,7,22,.97) 100%); }
#home::after { content: ''; position: absolute; left: 0; top: 0; width: 1100px; height: 460px; background: radial-gradient(ellipse at 0 0, rgba(7,7,22,.86), rgba(7,7,22,0) 72%); }
.clock { position: absolute; left: 96px; top: 34px; z-index: 2; }
#time { font-family: var(--display); font-weight: 700; font-size: 236px; line-height: 0.86; letter-spacing: -2px; color: var(--bone); text-shadow: 0 0 44px rgba(255,161,61,.35), 0 4px 0 #1a1030; display: block; }
#time small { font-family: var(--ui); font-weight: 500; font-size: 42px; letter-spacing: 1px; margin-left: 16px; color: var(--ember); text-shadow: none; }
#date { font-size: 42px; font-weight: 500; color: var(--bone); margin-top: 18px; }
.wx { position: absolute; right: 96px; top: 56px; text-align: right; z-index: 2; text-shadow: 0 2px 14px rgba(0,0,0,.9); }
#wxTemp { font-family: var(--display); font-weight: 600; font-size: 128px; line-height: 0.9; color: var(--bone); }
#wxText { font-size: 34px; font-weight: 600; color: var(--arc); margin-top: 8px; }
#wxRange { font-size: 28px; color: var(--ash); margin-top: 4px; }
.lower { position: absolute; left: 96px; right: 96px; bottom: 44px; z-index: 2; }
.strip { display: grid; grid-template-columns: 720px 1fr; grid-column-gap: 40px; align-items: end; height: 118px; margin-bottom: 26px; }
#status { display: grid; grid-template-columns: 96px 1fr; grid-column-gap: 18px; align-items: center; }
#status canvas { width: 96px; height: 96px; image-rendering: pixelated; }
#stName { font-size: 30px; font-weight: 600; color: var(--bone); white-space: nowrap; }
#stDepth { font-size: 25px; color: var(--ash); margin: 2px 0 8px; white-space: nowrap; }
.bar { height: 8px; background: rgba(255,255,255,.1); position: relative; overflow: hidden; }
.bar i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--arc); display: block; }
.bar.hp i { background: var(--wound); } .bar.xp i { background: var(--ember); } .bar.life i { background: var(--life); }
#banner { justify-self: end; display: none; border: 2px solid var(--ember); background: rgba(40,20,14,.88); color: var(--bone); font-family: var(--ui); font-size: 30px; font-weight: 600; padding: 18px 32px; text-align: left; animation: ember 2.4s ease-in-out infinite; }
#banner.on { display: block; }
#banner span { display: block; font-size: 24px; font-weight: 400; color: #e8cdb1; margin-top: 2px; }
#banner.focus { border-color: var(--arc); background: rgba(10,40,52,.94); transform: scale(1.03); }
@keyframes ember { 0%, 100% { box-shadow: 0 0 18px rgba(255,161,61,.3); } 50% { box-shadow: 0 0 44px rgba(255,161,61,.8); } }

/* app windows */
.row { display: grid; grid-template-columns: repeat(11, 142px); grid-column-gap: 14px; }
.tile { position: relative; width: 142px; height: 236px; transition: transform .14s ease-out; }
.frame, .glass { position: absolute; clip-path: polygon(50% 0, 63% 5%, 77% 14%, 88% 26%, 96% 40%, 100% 55%, 100% 100%, 0 100%, 0 55%, 4% 40%, 12% 26%, 23% 14%, 37% 5%); }
.frame { left: 0; top: 0; width: 142px; height: 190px; background: #2c2848; }
.glass { left: 7px; top: 8px; width: 128px; height: 175px; background-color: var(--c); background-image: linear-gradient(to bottom, rgba(255,255,255,.26), rgba(0,0,0,.5)), repeating-linear-gradient(60deg, rgba(5,4,12,.5) 0 2px, transparent 2px 30px), repeating-linear-gradient(-60deg, rgba(5,4,12,.5) 0 2px, transparent 2px 30px); opacity: .72; }
.tile b { position: absolute; left: 0; right: 0; top: 52px; text-align: center; font-family: var(--display); font-weight: 800; font-size: 96px; line-height: 1; color: var(--bone); text-shadow: 0 3px 0 rgba(0,0,0,.6), 0 0 22px rgba(0,0,0,.5); }
.tile.small b { font-size: 76px; top: 66px; }
.tile em { position: absolute; left: -10px; right: -10px; top: 198px; text-align: center; font-style: normal; font-size: 24px; font-weight: 600; color: var(--ash); white-space: nowrap; }
.tile.focus { transform: translateY(-18px) scale(1.12); z-index: 3; filter: drop-shadow(0 0 16px var(--c)); }
.tile.focus .frame { background: var(--arc); }
.tile.focus .glass { opacity: 1; }
.tile.focus em { color: var(--bone); }
.tile.deep .frame { background: #6a4417; }
.tile.ready .frame { background: var(--ember); }

/* dungeon hud */
.hud { position: absolute; z-index: 2; }
#hudDepth { left: 96px; top: 54px; width: 760px; }
#hudDepth h2 { font-family: var(--display); font-weight: 700; font-size: 58px; line-height: 1; color: var(--bone); text-shadow: 0 2px 10px #000; }
#hudDepth p { font-size: 27px; color: var(--ash); margin: 8px 0 10px; text-shadow: 0 2px 6px #000; }
#hudTime { right: 96px; top: 54px; text-align: right; text-shadow: 0 2px 10px #000; }
#hudClock { font-family: var(--display); font-weight: 700; font-size: 74px; line-height: 1; }
#hudWx { font-size: 27px; color: var(--ash); margin-top: 4px; }
#hudHero { left: 96px; bottom: 50px; width: 640px; display: grid; grid-template-columns: 1fr; grid-row-gap: 6px; text-shadow: 0 2px 6px #000; }
#hudName { font-size: 32px; font-weight: 600; }
#hudName small { font-size: 26px; font-weight: 400; color: var(--ash); margin-left: 10px; }
.hudBars { display: grid; grid-template-columns: 1fr 1fr; grid-column-gap: 14px; }
#hudMeta { font-size: 24px; color: var(--ash); }
#hudLog { right: 96px; bottom: 50px; width: 740px; text-align: right; font-size: 25px; line-height: 1.32; color: var(--ash); text-shadow: 0 2px 6px #000; }
#hudLog div:first-child { color: var(--bone); }
#hudLog .good { color: var(--life); } #hudLog .bad { color: #ff8c9f; } #hudLog .boss { color: var(--ember); }
#hudLog .r1 { color: #66e08f; } #hudLog .r2 { color: #5cc8ff; } #hudLog .r3 { color: #c58bff; } #hudLog .r4 { color: #ffb340; }
#hudHint { left: 0; right: 0; bottom: 14px; text-align: center; font-size: 22px; color: rgba(241,233,216,.6); }
#hudBoss { left: 0; right: 0; top: 170px; text-align: center; font-family: var(--display); font-weight: 700; font-size: 74px; color: var(--wound); text-shadow: 0 3px 18px #000; display: none; }
#ev { position: absolute; left: 340px; top: 40px; width: 1240px; z-index: 3; text-align: center; display: none; }
#run.event #hudDepth, #run.event #hudTime { visibility: hidden; }

#evNum { font-family: var(--display); font-weight: 800; font-size: 72px; line-height: 1; }
#evRes.ok #evNum { color: var(--arc); } #evRes.no #evNum { color: var(--wound); }

#evNote { font-size: 27px; color: var(--ember); font-weight: 600; text-shadow: 0 2px 8px #000; }
#ready { position: absolute; left: 560px; top: 430px; width: 800px; text-align: center; z-index: 3; display: none; border: 2px solid var(--ember); background: rgba(24,14,14,.9); padding: 24px 28px; font-size: 32px; font-weight: 600; animation: ember 2.4s ease-in-out infinite; }

.menu { background: linear-gradient(to bottom, rgba(7,7,22,.86), rgba(7,7,22,.95)); padding: 56px 96px; }

.card canvas { width: 252px; height: 216px; margin-left: -34px; image-rendering: pixelated; }
.card h4 { font-family: var(--display); font-weight: 700; font-size: 60px; line-height: 1; }

.btn { display: inline-block; background: rgba(21,19,42,.9); border: 2px solid var(--line); color: var(--bone); font-family: var(--ui); font-size: 30px; font-weight: 600; padding: 15px 34px; margin-right: 18px; }
.foot { position: absolute; left: 96px; right: 96px; bottom: 50px; font-size: 26px; color: var(--ash); }
.sheet { display: grid; grid-template-columns: 300px 1fr; grid-column-gap: 40px; margin-top: 34px; align-items: start; }
.sheet canvas { width: 300px; height: 258px; image-rendering: pixelated; }
.abil { display: grid; grid-template-columns: repeat(6, 150px); grid-gap: 14px; margin: 8px 0 28px; }
.abil div { border: 2px solid var(--line); text-align: center; padding: 10px 0 8px; background: rgba(21,19,42,.9); }
.abil u { display: block; text-decoration: none; font-size: 24px; color: var(--ash); }

.node { position: relative; border: 2px solid var(--line); background: rgba(21,19,42,.9); padding: 13px 16px; height: 142px; margin-bottom: 20px; color: var(--ash); font-family: var(--ui); text-align: left; }
.node::after { content: ''; position: absolute; left: 50%; bottom: -22px; width: 2px; height: 20px; background: var(--line); }
.node:last-child::after { display: none; }
.node strong { display: block; font-size: 27px; font-weight: 600; color: inherit; }

/* forge */
.ups { display: grid; grid-template-columns: repeat(2, 1fr); grid-gap: 20px; margin-top: 30px; }
.up { border: 2px solid var(--line); background: rgba(21,19,42,.9); padding: 18px 24px; color: var(--bone); font-family: var(--ui); text-align: left; display: grid; grid-template-columns: 1fr 200px; align-items: center; }

  function refreshHome() {

  }
  function drawPortrait(c, race, cls, frame) {
    var g = c.getContext('2d'), f = A.hero(race, cls)[frame || 0]; g.clearRect(0, 0, c.width, c.height); g.imageSmoothingEnabled = false; g.drawImage(f.c, 0, 0, f.w, f.h, (c.width - f.w) / 2, c.height - f.h, f.w, f.h);

  }

  function enter() {

  /* ---------- hero creation ---------- */

  function pickName(r) { var a = WG.RACES[r].names; return a[Math.floor(Math.random() * a.length)]; }

  /* ---------- skill tree and character sheet ---------- */

    $('charBox').innerHTML = '<canvas width="84" height="72"></canvas><b>' + h.name + '</b>, level ' + h.level + ' ' + WG.RACES[h.race].name + ' ' + WG.CLASSES[h.cls].name + '<br>' + Math.round(h.hp) + ' of ' + s.hp + ' health<br>' + Math.round(s.atk) + ' damage, ' + Math.round(s.armor) + ' armor<br>' + Math.round(s.crit) + '% critical, ' + Math.round(s.dodge) + '% dodge<br>' + WG.RACES[h.race].trait + '<br><br>' + gl;

  /* ---------- death and the forge ---------- */

  /* ---------- dungeon hud ---------- */

  /* ---------- weather ---------- */
  function wxCode(c) {
    if (c === 0) return ['Clear', 'clear']; if (c === 1) return ['Mostly clear', 'clear']; if (c === 2) return ['Partly cloudy', 'cloud']; if (c === 3) return ['Overcast', 'cloud'];
    if (c === 45 || c === 48) return ['Fog', 'fog']; if (c >= 51 && c <= 57) return ['Drizzle', 'rain']; if (c >= 61 && c <= 67) return ['Rain', 'rain'];
    if (c >= 71 && c <= 77) return ['Snow', 'snow']; if (c >= 80 && c <= 82) return ['Showers', 'rain']; if (c === 85 || c === 86) return ['Snow showers', 'snow']; if (c >= 95) return ['Thunderstorms', 'storm'];
    return ['Unsettled', 'cloud'];
  }
  function setWx(t, code, hi, lo, note) {
    var w = wxCode(code); S.weather = w[1];
    $('wxTemp').textContent = Math.round(t) + '°'; $('wxText').textContent = w[0] + (note || ''); $('wxRange').textContent = 'High ' + Math.round(hi) + '°, low ' + Math.round(lo) + '°, Virginia Beach';
    $('hudWx').textContent = Math.round(t) + '° ' + w[0].toLowerCase();
  }
  function weather() {
    fetch('https://api.open-meteo.com/v1/forecast?latitude=36.8529&longitude=-75.978&current=temperature_2m,weather_code&daily=temperature_2m_max,temperature_2m_min&temperature_unit=fahrenheit&timezone=America%2FNew_York&forecast_days=1')
      .then(function (r) { return r.json(); })
      .then(function (j) { setWx(j.current.temperature_2m, j.current.weather_code, j.daily.temperature_2m_max[0], j.daily.temperature_2m_min[0]); })
      .catch(function () {
        if (UI.preview) { setWx(54, 0, 61, 44, ', sample'); return; }
        $('wxTemp').textContent = ''; $('wxText').textContent = 'Weather is unavailable'; $('wxRange').textContent = 'Trying again in 20 minutes';
      });
  }

  /* ---------- ambience: wind, a low hum and a little fire, all quiet ---------- */
  WG.Sound = {
    ctx: null,
    start: function () {
      if (WG.Sound.ctx || !G.save.ambience) { if (WG.Sound.ctx && WG.Sound.ctx.state === 'suspended') WG.Sound.ctx.resume(); return; }
      var AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
      try {
        var c = new AC(), out = c.createGain(); out.gain.value = 0.05; out.connect(c.destination); WG.Sound.ctx = c;
        var len = c.sampleRate * 4, buf = c.createBuffer(1, len, c.sampleRate), d = buf.getChannelData(0), last = 0, i;
        for (i = 0; i < len; i++) { last = last * 0.985 + (Math.random() * 2 - 1) * 0.06; d[i] = last * 2.6; }
        var w = c.createBufferSource(); w.buffer = buf; w.loop = true; var lp = c.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 340; var wg = c.createGain(); wg.gain.value = 0.9;
        var lfo = c.createOscillator(), lg = c.createGain(); lfo.frequency.value = 0.09; lg.gain.value = 130; lfo.connect(lg); lg.connect(lp.frequency); lfo.start();
        w.connect(lp); lp.connect(wg); wg.connect(out); w.start();
        [55, 82.5].forEach(function (f) { var o = c.createOscillator(), g = c.createGain(); o.type = 'sine'; o.frequency.value = f; g.gain.value = 0.16; o.connect(g); g.connect(out); o.start(); });
        var cb = c.createBuffer(1, c.sampleRate * 6, c.sampleRate), e = cb.getChannelData(0);
        for (i = 0; i < 46; i++) { var p = Math.random() * (e.length - 500) | 0, a = 0.2 + Math.random() * 0.6; for (var k = 0; k < 280; k++) e[p + k] += (Math.random() * 2 - 1) * a * Math.exp(-k / 60); }
        var cr = c.createBufferSource(); cr.buffer = cb; cr.loop = true; var hp = c.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 1400; var cg = c.createGain(); cg.gain.value = 0.34; cr.connect(hp); hp.connect(cg); cg.connect(out); cr.start();
      } catch (err) { WG.Sound.ctx = null; }
    }
  };
  document.addEventListener('visibilitychange', function () { var c = WG.Sound.ctx; if (!c) return; if (document.hidden) c.suspend(); else c.resume(); });

  /* ---------- main loop ---------- */
  var lastT = 0, acc = 0, step = 1 / 30, save = 0;
  function loop(now) {
    requestAnimationFrame(loop);
    if (document.hidden) { lastT = now; return; }
    var dt = Math.min(0.1, (now - lastT) / 1000); if (now - lastT < 31) return; lastT = now;
    var t = now / 1000, d = new Date(), hr = d.getHours() + d.getMinutes() / 60, h = G.save.hero;
    if (UI.view === 'home' && Date.now() - UI.last > IDLE_MS && h && h.phase !== 'dead' && !h.pending) { UI.idle = true; show('run'); }
    if (UI.view === 'run' && h) {
      acc += dt * UI.speed; G.showFx = UI.speed <= 12;
      while (acc >= 0.1) { G.step(0.1); acc -= 0.1; h = G.save.hero; }
      while (G.fx.length) S.onFx(G.fx.shift());
      S.run(t, dt, h, h.phase === 'walk');
      save += dt; if (save > 30) { save = 0; G.store(); }
    } else if (UI.view === 'home') S.home(t, dt, hr, h);
    else if (h) { S.run(t, dt, h, false); }
    else S.home(t, dt, hr, null);
  }

  function fit() {
    var box = $('wrap'), bw = box.clientWidth, bh = box.clientHeight, k = Math.min(bw / 1920, bh / 1080), st = $('stage');
    st.style.transform = 'translate(' + ((bw - 1920 * k) / 2) + 'px,' + ((bh - 1080 * k) / 2) + 'px) scale(' + k + ')';
  }
  window.addEventListener('resize', fit);

  UI.start = function () {
    G.load(); if (!G.save.hero && UI.preview && !G.save.meta.deaths) UI.demo && UI.demo();
    S.init($('view')); buildRow(); fit();
    $('createForgeBtn').wgAct = function () { UI.forgeBack = function () { drawCreate(); show('create', true); firstFocus(); }; drawForge(); show('forge', true); firstFocus(); };
    tick(); setInterval(tick, 1000); setInterval(function () { hud(); if (UI.view === 'home') refreshHome(); }, 400); weather(); setInterval(weather, 20 * 60 * 1000);
    window.addEventListener('beforeunload', function () { G.store(); });

  };
  UI.enter = enter; UI.openHero = openHero;
})();

WG.UI.start();</script></body></html>

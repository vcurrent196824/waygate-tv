:root { --void: #0c0a14; --panel: #181320; --line: #453748; --bone: #f3ead7; --ash: #bdb1b8; --gold: #ffc933; --pink: #ff2e88; --safe: #39e58c; --blood: #e5303a; --ice: #7fe9ff;
  --display: 'Bungee', 'Arial Black', Impact, sans-serif; --ui: 'Chakra Petch', 'Segoe UI', Arial, sans-serif; }
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 100%; height: 100%; background: var(--void); color: var(--bone); overflow: hidden; font-family: var(--ui); }
#wrap { position: absolute; left: 0; top: 0; width: 100%; height: 100%; overflow: hidden; background: var(--void); }
#stage { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; overflow: hidden; transform-origin: 0 0; background: var(--void); }
#view { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; image-rendering: pixelated; }
.screen { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; display: none; }
.screen.on { display: block; }

/* home */
#home::before { content: ''; position: absolute; left: 0; right: 0; bottom: 0; height: 470px; background: linear-gradient(to bottom, rgba(12,10,20,0), rgba(12,10,20,.86) 30%, rgba(12,10,20,.98) 100%); }
#home::after { content: ''; position: absolute; left: 0; top: 0; width: 1920px; height: 330px; background: linear-gradient(to bottom, rgba(12,10,20,.9), rgba(12,10,20,0)); }
.clock { position: absolute; left: 84px; top: 36px; z-index: 2; }
#time { font-family: var(--display); font-weight: 400; font-size: 156px; line-height: 1; letter-spacing: -2px; color: var(--bone); text-shadow: 6px 6px 0 var(--pink); display: block; white-space: nowrap; }
#time small { font-family: var(--display); font-size: 44px; letter-spacing: 0; margin-left: 18px; color: var(--gold); text-shadow: none; }
#date { font-size: 40px; font-weight: 500; color: var(--bone); margin-top: 10px; text-shadow: 0 2px 8px #000; }
.wx { position: absolute; right: 84px; top: 40px; width: 440px; text-align: right; z-index: 2; text-shadow: 0 2px 10px #000; }
#wxTemp { font-family: var(--display); font-size: 100px; line-height: 1; color: var(--gold); text-shadow: 5px 5px 0 #7a1a4a; }
#wxText { font-size: 32px; font-weight: 600; color: var(--bone); margin-top: 8px; }
#wxRange { font-size: 26px; color: var(--ash); }
#sys { position: absolute; left: 800px; top: 54px; width: 620px; z-index: 2; font-size: 27px; line-height: 1.26; color: var(--bone); text-shadow: 0 2px 8px #000; transition: opacity .6s; }
#sys b { display: block; font-family: var(--display); font-weight: 400; font-size: 24px; color: var(--pink); margin-bottom: 4px; }
#sys.dim { opacity: 0; }
.lower { position: absolute; left: 84px; right: 84px; bottom: 30px; z-index: 2; }
.strip { display: grid; grid-template-columns: 660px 1fr; grid-column-gap: 40px; align-items: center; height: 126px; margin-bottom: 16px; }
#status { display: grid; grid-template-columns: 96px 1fr; grid-column-gap: 16px; align-items: center; }
#status canvas { width: 96px; height: 82px; image-rendering: pixelated; }
#stName { font-size: 29px; line-height: 1.1; font-weight: 600; color: var(--bone); white-space: nowrap; }
#stClass { font-size: 24px; line-height: 1.2; color: var(--bone); white-space: nowrap; }
#stDepth { font-size: 24px; line-height: 1.2; color: var(--ash); margin-bottom: 6px; white-space: nowrap; }
.bar { height: 10px; background: rgba(255,255,255,.12); position: relative; overflow: hidden; }
.bar i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--gold); display: block; }
.bar.hp i { background: var(--blood); } .bar.xp i { background: var(--ice); }
#tip h3 { font-family: var(--display); font-weight: 400; font-size: 34px; line-height: 1.1; color: var(--gold); white-space: nowrap; }
#tip p { font-size: 26px; line-height: 1.24; color: var(--bone); margin-top: 4px; height: 66px; overflow: hidden; }
#banner { position: absolute; right: 0; bottom: 336px; display: none; border: 4px solid var(--gold); background: #2a1420; color: var(--bone); font-family: var(--display); font-size: 36px; padding: 16px 30px; animation: blare 1.8s steps(2, end) infinite; }
#banner.on { display: block; }
#banner span { display: block; font-family: var(--ui); font-size: 25px; font-weight: 500; color: var(--bone); margin-top: 4px; }
#banner.focus { border-color: var(--safe); box-shadow: 10px 10px 0 var(--safe); animation: none; }
@keyframes blare { 0%, 100% { box-shadow: 8px 8px 0 var(--pink); } 50% { box-shadow: 8px 8px 0 var(--gold); } }

/* loot box apps */
.row { display: grid; grid-template-columns: repeat(11, 142px); grid-column-gap: 14px; }
.tile { position: relative; width: 142px; height: 182px; transition: transform .1s steps(2, end); }
.tile canvas { position: absolute; left: 7px; top: 8px; width: 128px; height: 120px; image-rendering: pixelated; }
.tile b { position: absolute; left: 44px; top: 66px; width: 54px; height: 50px; background: var(--c); border: 3px solid rgba(0,0,0,.55); text-align: center; font-family: var(--display); font-weight: 400; font-size: 30px; line-height: 44px; color: #fff; text-shadow: 2px 2px 0 rgba(0,0,0,.6); }
.tile.small b { font-size: 22px; }
.tile em { position: absolute; left: -8px; right: -8px; top: 136px; text-align: center; font-style: normal; font-size: 25px; font-weight: 600; color: var(--ash); white-space: nowrap; }
.tile.focus { transform: translateY(-14px) scale(1.14); z-index: 3; }
.tile.focus em { color: var(--gold); }
.tile.ready em { color: var(--pink); }

/* dungeon hud */
.hud { position: absolute; z-index: 2; }
#hudDepth { left: 84px; top: 46px; width: 1300px; }
#hudDepth h2 { white-space: nowrap; font-family: var(--display); font-weight: 400; font-size: 50px; line-height: 1.04; color: var(--bone); text-shadow: 4px 4px 0 var(--pink); }
#hudDepth p { font-size: 27px; color: var(--bone); margin-top: 6px; text-shadow: 0 2px 6px #000; }
#hudLeft { color: var(--gold) !important; font-weight: 600; }
#hudDepth .bar { margin-top: 10px; width: 620px; }
#hudTime { right: 84px; top: 46px; text-align: right; text-shadow: 0 2px 10px #000; }
#hudClock { font-family: var(--display); font-size: 62px; line-height: 1; }
#hudWx { font-size: 27px; color: var(--bone); margin-top: 6px; }
#hudViews { font-size: 27px; color: var(--gold); font-weight: 600; margin-top: 2px; }
#hudHero { left: 84px; bottom: 44px; width: 660px; display: grid; grid-template-columns: 1fr; grid-row-gap: 6px; text-shadow: 0 2px 6px #000; }
#hudName { font-size: 31px; font-weight: 600; white-space: nowrap; }
#hudName small { font-size: 25px; font-weight: 400; color: var(--ash); margin-left: 10px; }
.hudBars { display: grid; grid-template-columns: 1fr 1fr; grid-column-gap: 14px; }
#hudMeta { font-size: 24px; color: var(--ash); }
#hudLog { right: 84px; bottom: 44px; width: 800px; text-align: right; font-size: 25px; line-height: 1.32; color: var(--ash); text-shadow: 0 2px 6px #000; }
#hudLog .good { color: var(--safe); } #hudLog .bad { color: #ff8c9f; } #hudLog .boss { color: var(--gold); } #hudLog .ach { color: var(--pink); }
#hudHint { left: 0; right: 0; bottom: 8px; text-align: center; font-size: 22px; color: rgba(243,234,215,.62); }
#hudBoss { left: 0; right: 0; top: 196px; text-align: center; display: none; text-shadow: 4px 4px 0 #000; }
#hudTier { display: block; font-family: var(--display); font-size: 28px; color: var(--gold); }
#hudBossName { display: block; font-family: var(--display); font-size: 56px; line-height: 1.04; color: var(--blood); }
#hudChat { left: 420px; right: 420px; top: 300px; text-align: center; display: none; font-size: 28px; line-height: 1.25; }
#hudChat b, #hudChat span { background: rgba(12,10,20,.84); padding: 4px 12px; }
#hudChat b { display: inline-block; font-family: var(--display); font-weight: 400; font-size: 22px; color: var(--pink); margin-bottom: 4px; }
#hudChat span { display: block; color: var(--bone); }
#ev { position: absolute; left: 310px; top: 34px; width: 1300px; z-index: 3; text-align: center; display: none; }
#run.event #hudDepth, #run.event #hudTime, #run.event #hudChat { visibility: hidden; }
#evTop { background: rgba(12,10,20,.9); border: 4px solid var(--gold); box-shadow: 8px 8px 0 var(--pink); padding: 18px 36px 20px; }
#ev.on { display: block; }
#ev h3 { font-family: var(--display); font-weight: 400; font-size: 50px; line-height: 1.08; color: var(--gold); }
#ev p { font-size: 31px; line-height: 1.3; margin-top: 10px; color: var(--bone); }
#ev .chk { font-size: 28px; font-weight: 600; color: var(--ice); margin-top: 10px; }
#evDie { position: absolute; left: 0; right: 0; top: 448px; text-align: center; font-family: var(--display); font-size: 112px; line-height: 1; color: var(--bone); text-shadow: 5px 5px 0 #000; display: none; }
#evRes { position: absolute; left: 70px; right: 70px; top: 716px; display: none; background: rgba(12,10,20,.92); padding: 10px 24px 14px; }
#evRes.on { display: block; }
#evNum { font-family: var(--display); font-size: 56px; line-height: 1.06; }
#evRes.ok #evNum { color: var(--safe); } #evRes.no #evNum { color: var(--blood); }
#evRes p { margin-top: 2px; }
#evNote { font-size: 27px; color: var(--gold); font-weight: 600; }
#ready { position: absolute; left: 530px; top: 440px; width: 860px; text-align: center; z-index: 3; display: none; border: 4px solid var(--safe); background: rgba(12,28,22,.94); padding: 22px 28px; font-family: var(--display); font-size: 40px; animation: blare 1.8s steps(2, end) infinite; }
#ready span { display: block; font-family: var(--ui); font-size: 27px; font-weight: 500; margin-top: 6px; }

/* shared menu look */
.menu { background: rgba(12,10,20,.93); padding: 46px 84px; }
.menu h1 { font-family: var(--display); font-weight: 400; font-size: 68px; line-height: 1.04; color: var(--bone); text-shadow: 5px 5px 0 var(--pink); }
.menu h1.long { font-size: 54px; }
.menu h2 { font-family: var(--display); font-weight: 400; font-size: 32px; color: var(--gold); margin-bottom: 14px; }
.menu .sub { font-size: 30px; color: var(--bone); margin-top: 10px; }
.menu .note { font-size: 26px; color: var(--ash); margin-top: 4px; }
.cards { display: grid; grid-template-columns: repeat(3, 1fr); grid-gap: 22px; margin-top: 26px; }
.card { background: var(--panel); border: 3px solid var(--line); padding: 16px 20px; display: grid; grid-template-columns: 180px 1fr; grid-column-gap: 14px; align-items: center; height: 366px; color: var(--bone); }
.card canvas { width: 210px; height: 180px; margin-left: -28px; image-rendering: pixelated; }
.card h4 { font-family: var(--display); font-weight: 400; font-size: 32px; line-height: 1.08; }
.card h5 { font-size: 25px; font-weight: 600; color: var(--gold); margin: 8px 0; line-height: 1.16; }
.card p { font-size: 24px; line-height: 1.24; color: var(--ash); }
.card.focus, .btn.focus, .node.focus, .up.focus, .bx.focus { border-color: var(--gold); background: #2a1c30; box-shadow: 8px 8px 0 var(--pink); }
